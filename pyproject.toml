[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib-generator"
version = "1.0.0"
description = "Automatically generate high-resolution DIN A5 bibs for sports events"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "img2pdf>=0.5.0",
]

[project.scripts]
bib-generator = "main:cli_main"
bib-single = "bib:cli_main"
